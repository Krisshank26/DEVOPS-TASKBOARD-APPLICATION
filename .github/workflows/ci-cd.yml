name: TaskBoard CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  TF_ROOT: ./terraform
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  test:
    name: Test and validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
        working-directory: backend

      - name: Run backend tests
        run: python -m pytest -q
        working-directory: backend

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm install 
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint Helm chart
        run: helm lint ./helm/taskboard

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.6"

      - name: Check Terraform formatting
        run: terraform -chdir="$TF_ROOT" fmt -check -recursive

      - name: Initialize Terraform for validation
        run: terraform -chdir="$TF_ROOT" init -backend=false -input=false

      - name: Validate Terraform
        run: terraform -chdir="$TF_ROOT" validate

  build-scan-push:
    name: Build, scan, and publish container images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.images.outputs.backend }}
      frontend_image: ${{ steps.images.outputs.frontend }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Define image names
        id: images
        shell: bash
        run: |
          set -euo pipefail
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          echo "backend=${REGISTRY}/${OWNER_LC}/taskboard-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=${REGISTRY}/${OWNER_LC}/taskboard-frontend" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          load: true
          tags: ${{ steps.images.outputs.backend }}:${{ github.sha }}
          cache-from: type=gha,scope=taskboard-backend
          cache-to: type=gha,mode=max,scope=taskboard-backend

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          load: true
          tags: ${{ steps.images.outputs.frontend }}:${{ github.sha }}
          cache-from: type=gha,scope=taskboard-frontend
          cache-to: type=gha,mode=max,scope=taskboard-frontend

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.backend }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.frontend }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Push backend and frontend images to GHCR
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          docker push "${{ steps.images.outputs.backend }}:${GITHUB_SHA}"
          docker push "${{ steps.images.outputs.frontend }}:${GITHUB_SHA}"

  deploy: 
    name: Provision infrastructure and deploy to EKS
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }} 
      POSTGRES_USER: ${{ vars.POSTGRES_USER }} 
      BACKEND_IMAGE: ${{ needs.build-scan-push.outputs.backend_image }}
      FRONTEND_IMAGE: ${{ needs.build-scan-push.outputs.frontend_image }}
      IMAGE_TAG: ${{ github.sha }}
      GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7 

      - name: Check required deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$AWS_REGION" ]] || { echo "Missing production environment variable AWS_REGION"; exit 1; }
          [[ -n "$AWS_ROLE_ARN" ]] || { echo "Missing production environment variable AWS_ROLE_ARN"; exit 1; }
          if [[ -n "$GHCR_PULL_USERNAME" && -z "$GHCR_PULL_TOKEN" ]] || [[ -z "$GHCR_PULL_USERNAME" && -n "$GHCR_PULL_TOKEN" ]]; then
            echo "Set both GHCR_PULL_USERNAME and GHCR_PULL_TOKEN, or leave both empty for public GHCR packages."
            exit 1
          fi
          [[ -d "$TF_ROOT" ]] || { echo "Terraform directory not found: $TF_ROOT"; exit 1; }

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.6"

      - name: Initialize Terraform
        run: terraform -chdir="$TF_ROOT" init -input=false

      - name: Validate Terraform
        run: terraform -chdir="$TF_ROOT" validate

      - name: Create Terraform plan
        run: terraform -chdir="$TF_ROOT" plan -input=false -out=tfplan

      - name: Apply Terraform plan
        run: terraform -chdir="$TF_ROOT" apply -input=false -auto-approve tfplan

      - name: Configure access to EKS
        run: |
          set -euo pipefail
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4 

      - name: Create PostgreSQL Kubernetes Secret
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$POSTGRES_PASSWORD"

          kubectl create namespace taskboard \
            --dry-run=client -o yaml | kubectl apply -f -

          secret_file="$(mktemp)"
          chmod 600 "$secret_file"
          trap 'rm -f "$secret_file"' EXIT

          printf '%s' "$POSTGRES_PASSWORD" > "$secret_file"

          kubectl create secret generic taskboard-postgres-secret \
            --namespace taskboard \
            --from-file=POSTGRES_PASSWORD="$secret_file" \
            --dry-run=client -o yaml |
            kubectl apply -f -

          unset POSTGRES_PASSWORD

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Verify Kubernetes access
        run: |
          set -euo pipefail
          kubectl config current-context
          kubectl get nodes

      - name: Deploy TaskBoard with blue-green Helm rollout
        shell: bash
        run: |
          set -euo pipefail

          # The supplied values.yaml stores image repositories as scalar strings,
          # and stores version tags separately under blue.*Tag and green.*Tag.
          # The first release bootstraps both colors with this build. Later releases
          # update only the inactive color, wait for readiness, and then switch activeColor.

          RELEASE_NAME="taskboard"
          NAMESPACE="taskboard"
          CHART="./helm/taskboard"
          VALUES_FILE="$CHART/values.yaml"

          if helm status "$RELEASE_NAME" --namespace "$NAMESPACE" >/dev/null 2>&1; then
            helm get values "$RELEASE_NAME" --namespace "$NAMESPACE" --all --output json > /tmp/taskboard-current-values.json
            CURRENT_COLOR="$(jq -r '.activeColor // "blue"' /tmp/taskboard-current-values.json)"
            BLUE_FRONTEND_TAG="$(jq -r '.blue.frontendTag // "latest"' /tmp/taskboard-current-values.json)"
            BLUE_BACKEND_TAG="$(jq -r '.blue.backendTag // "latest"' /tmp/taskboard-current-values.json)"
            GREEN_FRONTEND_TAG="$(jq -r '.green.frontendTag // "latest"' /tmp/taskboard-current-values.json)"
            GREEN_BACKEND_TAG="$(jq -r '.green.backendTag // "latest"' /tmp/taskboard-current-values.json)"
            BOOTSTRAP="false"
          else
            CURRENT_COLOR="blue"
            BLUE_FRONTEND_TAG="$IMAGE_TAG"
            BLUE_BACKEND_TAG="$IMAGE_TAG"
            GREEN_FRONTEND_TAG="$IMAGE_TAG"
            GREEN_BACKEND_TAG="$IMAGE_TAG"
            BOOTSTRAP="true"
          fi

          case "$CURRENT_COLOR" in
            blue)
              TARGET_COLOR="green"
              ;;
            green)
              TARGET_COLOR="blue"
              ;;
            *)
              echo "Unexpected activeColor '$CURRENT_COLOR'; expected blue or green."
              exit 1
              ;;
          esac

          if [[ "$BOOTSTRAP" == "true" ]]; then
            # Ensure the first install does not try to pull the nonexistent 'latest' tag.
            BLUE_FRONTEND_TAG="$IMAGE_TAG"
            BLUE_BACKEND_TAG="$IMAGE_TAG"
            GREEN_FRONTEND_TAG="$IMAGE_TAG"
            GREEN_BACKEND_TAG="$IMAGE_TAG"
          elif [[ "$TARGET_COLOR" == "blue" ]]; then
            BLUE_FRONTEND_TAG="$IMAGE_TAG"
            BLUE_BACKEND_TAG="$IMAGE_TAG"
          else
            GREEN_FRONTEND_TAG="$IMAGE_TAG"
            GREEN_BACKEND_TAG="$IMAGE_TAG"
          fi

          # Create the namespace before optionally adding a GHCR pull secret.
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

          # Private GHCR packages need an imagePullSecret in the cluster. Public packages do not.
          IMAGE_PULL_ARGS=()
          if [[ -n "$GHCR_PULL_USERNAME" && -n "$GHCR_PULL_TOKEN" ]]; then
            kubectl create secret docker-registry ghcr-pull \
              --namespace "$NAMESPACE" \
              --docker-server=ghcr.io \
              --docker-username="$GHCR_PULL_USERNAME" \
              --docker-password="$GHCR_PULL_TOKEN" \
              --dry-run=client -o yaml | kubectl apply -f -
            IMAGE_PULL_ARGS+=(--set-string "imagePullSecrets[0].name=ghcr-pull")
          else
            echo "No GHCR pull credentials configured; taskboard images must be public for EKS to pull them."
          fi

          # The ServiceMonitor CRD only exists when the Prometheus Operator stack is installed.
          # Keep the chart installable on clusters without that CRD.
          if kubectl get crd servicemonitors.monitoring.coreos.com >/dev/null 2>&1; then
            SERVICE_MONITOR_ENABLED="true"
          else
            SERVICE_MONITOR_ENABLED="false"
            echo "Prometheus ServiceMonitor CRD not found; disabling monitoring.serviceMonitor for this release."
          fi

          COMMON_ARGS=(
            --namespace "$NAMESPACE"
            --create-namespace
            --values "$VALUES_FILE"
            --wait
            --atomic
            --timeout 10m
            --set-string "backend.image=$BACKEND_IMAGE"
            --set-string "frontend.image=$FRONTEND_IMAGE"
            --set-string "migrations.tag=$IMAGE_TAG"
            --set-string "postgres.username=$POSTGRES_USER" 
            --set-string "postgres.password=$POSTGRES_PASSWORD"
            --set "monitoring.serviceMonitor.enabled=$SERVICE_MONITOR_ENABLED"
          )
          COMMON_ARGS+=("${IMAGE_PULL_ARGS[@]}")

          COLOR_ARGS=(
            --set-string "blue.frontendTag=$BLUE_FRONTEND_TAG"
            --set-string "blue.backendTag=$BLUE_BACKEND_TAG"
            --set-string "green.frontendTag=$GREEN_FRONTEND_TAG"
            --set-string "green.backendTag=$GREEN_BACKEND_TAG"
          )

          echo "Currently active color: $CURRENT_COLOR"
          echo "Deploying new image to color: $TARGET_COLOR"
          echo "Image tag: $IMAGE_TAG"

          # Stage 1: update the candidate color while the existing color remains active.
          helm upgrade --install "$RELEASE_NAME" "$CHART" \
            "${COMMON_ARGS[@]}" \
            "${COLOR_ARGS[@]}" \
            --set-string "activeColor=$CURRENT_COLOR"

          # Stage 2: switch traffic only after Helm reports that the candidate is ready.
          helm upgrade --install "$RELEASE_NAME" "$CHART" \
            "${COMMON_ARGS[@]}" \
            "${COLOR_ARGS[@]}" \
            --set-string "activeColor=$TARGET_COLOR"

          echo "TaskBoard is now configured with activeColor=$TARGET_COLOR"

      - name: Show deployed resources
        run: kubectl get deployments,pods,services,ingress -n taskboard


