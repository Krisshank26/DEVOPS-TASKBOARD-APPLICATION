activeColor: blue

replicaCount: 2
namespace: taskboard

frontend:
  image: ghcr.io/krisshank26/taskboard-frontend

backend:
  image: ghcr.io/krisshank26/taskboard-backend

# Image tags for the two application versions.
blue:
  frontendTag: latest
  backendTag: latest

green:
  frontendTag: latest
  backendTag: latest

imagePullSecrets: []

postgres:
  host: taskboard-postgres
  database: taskboard
  username: taskboard 
  existingSecret: taskboard-postgres-secret 
  passwordKey: POSTGRES_PASSWORD 

migrations: 
  enabled: true 
  tag: latest 
  revision: local 

ingress:
  enabled: false
  host: taskboard.local

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

monitoring:
  serviceMonitor:
    enabled: true 