{{- $root := . }}
{{ range $color := list "blue" "green" }}
{{ $colorValues := index $root.Values $color }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taskboard.fullname" $root }}-backend-{{ $color }}
  labels:
    app.kubernetes.io/instance: {{ $root.Release.Name | quote }}
    app.kubernetes.io/name: taskboard
    app.kubernetes.io/component: backend
    app.kubernetes.io/color: {{ $color | quote }}
spec:
  replicas: {{ $root.Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $root.Release.Name | quote }}
      app.kubernetes.io/name: taskboard
      app.kubernetes.io/component: backend
      app.kubernetes.io/color: {{ $color | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $root.Release.Name | quote }}
        app.kubernetes.io/name: taskboard
        app.kubernetes.io/component: backend
        app.kubernetes.io/color: {{ $color | quote }}
    spec:
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ $root.Values.backend.image }}:{{ $colorValues.backendTag }}"
          ports:
            - name: http
              containerPort: 8000
          env:
          
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ $root.Values.postgres.existingSecret | quote }}
                key: {{ $root.Values.postgres.passwordKey | quote }}
        
          - name: DATABASE_URL
            value: {{ printf "postgresql+psycopg://%s:$(POSTGRES_PASSWORD)@%s:5432/%s" $root.Values.postgres.username $root.Values.postgres.host $root.Values.postgres.database | quote }}
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
{{ toYaml $root.Values.resources | indent 12 }}
{{ end }} 
