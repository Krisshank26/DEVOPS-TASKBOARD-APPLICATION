{{- $root := . }}
{{ range $color := list "blue" "green" }}
{{ $colorValues := index $root.Values $color }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taskboard.fullname" $root }}-backend-{{ $color }}
  labels:
    app.kubernetes.io/instance: {{ $root.Release.Name | quote }}
    app.kubernetes.io/name: taskboard
    app.kubernetes.io/component: backend
    app.kubernetes.io/color: {{ $color | quote }}
spec:
  replicas: {{ $root.Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $root.Release.Name | quote }}
      app.kubernetes.io/name: taskboard
      app.kubernetes.io/component: backend
      app.kubernetes.io/color: {{ $color | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $root.Release.Name | quote }}
        app.kubernetes.io/name: taskboard
        app.kubernetes.io/component: backend
        app.kubernetes.io/color: {{ $color | quote }}
    spec:
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ $root.Values.backend.image }}:{{ $colorValues.backendTag }}"
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              value: {{ printf "postgresql+psycopg://{{ .Values.postgres.username }}:{{ .Values.postgres.password }}@{{ .Values.postgres.host }}:5432/{{ .Values.postgres.database }}" }} 
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
{{ toYaml $root.Values.resources | indent 12 }}
{{ end }} 
