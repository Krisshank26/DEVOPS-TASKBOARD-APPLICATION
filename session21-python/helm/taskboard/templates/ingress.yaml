{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "taskboard.fullname" . }}-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-backend-%s" (include "taskboard.fullname" .) .Values.activeColor }}
                port:
                  number: 8000

          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-frontend-%s" (include "taskboard.fullname" .) .Values.activeColor }}
                port:
                  number: 80
{{- end }} 
